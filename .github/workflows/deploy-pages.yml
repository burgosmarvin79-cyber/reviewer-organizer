# Build, verify, and publish the app whenever main changes or Marvin runs it manually.
name: Deploy Reviewer Organizer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  # Follow least privilege: source is read-only, with write access only for Pages.
  contents: read
  pages: write
  id-token: write

concurrency:
  # A newer deployment replaces an older in-progress deployment.
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Configure Supabase environment
        # GitHub Secrets inject public connection values without committing them.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_URL" "$VITE_SUPABASE_PUBLISHABLE_KEY" > .env.local

      - name: Verify source
        # Deployment stops if code quality, behavior, or production compilation fails.
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload production build
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # Publishing waits for the verified build artifact from the build job.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
